<text x="20" y="36" class="title">firdash — data flow</text>
<rect x="20" y="60" width="230" height="560" rx="12" fill="#52514e" fill-opacity="0.07" stroke="#52514e" stroke-opacity="0.5"/><text x="135.0" y="84" class="h" text-anchor="middle" fill="#52514e">Fir cluster commands</text><rect x="35" y="100" width="200" height="52" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/><text x="45" y="119" class="t">diskusage_report</text><text x="45" y="137" class="s">/home, /scratch quotas</text><rect x="35" y="172" width="200" height="52" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/><text x="45" y="191" class="t">df  (per group dir)</text><text x="45" y="209" class="s">/project, /nearline quotas</text><rect x="35" y="244" width="200" height="52" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/><text x="45" y="263" class="t">diskusage_rbh</text><text x="45" y="281" class="s">per-user usage, tape vs disk</text><rect x="35" y="316" width="200" height="52" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/><text x="45" y="335" class="t">sinfo</text><text x="45" y="353" class="s">cores busy / idle / down</text><rect x="35" y="388" width="200" height="52" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/><text x="45" y="407" class="t">sshare</text><text x="45" y="425" class="s">fairshare per account</text><rect x="35" y="460" width="200" height="52" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/><text x="45" y="479" class="t">squeue</text><text x="45" y="497" class="s">my queued jobs</text><rect x="35" y="532" width="200" height="52" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/><text x="45" y="551" class="t">sacct</text><text x="45" y="569" class="s">job history (N days)</text><rect x="290" y="60" width="250" height="560" rx="12" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-opacity="0.5"/><text x="415.0" y="84" class="h" text-anchor="middle" fill="#2a78d6">collectors.py</text><rect x="305" y="108" width="220" height="36" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="315" y="127" class="t">user_quotas()</text><path d="M235,126 C270.0,126 270.0,126 299,126" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/><rect x="305" y="180" width="220" height="36" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="315" y="199" class="t">group_quotas()</text><path d="M235,198 C270.0,198 270.0,198 299,198" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/><rect x="305" y="252" width="220" height="36" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="315" y="271" class="t">user_breakdown(fs, group)</text><path d="M235,270 C270.0,270 270.0,270 299,270" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/><rect x="305" y="324" width="220" height="36" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="315" y="343" class="t">nodes()</text><path d="M235,342 C270.0,342 270.0,342 299,342" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/><rect x="305" y="396" width="220" height="36" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="315" y="415" class="t">fairshare()</text><path d="M235,414 C270.0,414 270.0,414 299,414" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/><rect x="305" y="468" width="220" height="36" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="315" y="487" class="t">jobs()</text><path d="M235,486 C270.0,486 270.0,486 299,486" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/><rect x="305" y="540" width="220" height="36" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="315" y="559" class="t">recent(days)</text><path d="M235,558 C270.0,558 270.0,558 299,558" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/><rect x="580" y="60" width="360" height="560" rx="12" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-opacity="0.5"/><text x="760.0" y="84" class="h" text-anchor="middle" fill="#eb6834">render.py</text><rect x="595" y="100" width="330" height="120" rx="8" fill="#fff7f2" stroke="#eb6834" stroke-width="1.5"/><text x="605" y="119" class="t">storage()  — cache 10 min</text><text x="605" y="137" class="s">groups() → def-* / rrg-* groups</text><text x="605" y="152" class="s">runs quota + per-user collectors</text><text x="605" y="167" class="s">in parallel threads</text><text x="605" y="182" class="s"></text><text x="605" y="197" class="s">slow: ~10 s, so cached longer</text><rect x="595" y="240" width="330" height="70" rx="8" fill="#fff7f2" stroke="#eb6834" stroke-width="1.5"/><text x="605" y="259" class="t">build(days)  — parallel threads</text><text x="605" y="277" class="s">storage() + fairshare + jobs + recent + nodes</text><text x="605" y="292" class="s">→ one self-contained HTML page</text><rect x="595" y="330" width="162" height="56" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="605" y="349" class="t">quota_chart ×2</text><text x="605" y="367" class="s">space %, file-count %</text><rect x="763" y="330" width="162" height="56" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="773" y="349" class="t">usage_chart ×2</text><text x="773" y="367" class="s">/project, /nearline by user</text><rect x="595" y="402" width="162" height="56" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="605" y="421" class="t">nodes_chart</text><text x="605" y="439" class="s">cluster cores</text><rect x="763" y="402" width="162" height="56" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="773" y="421" class="t">fairshare_chart</text><text x="773" y="439" class="s">per account</text><rect x="595" y="474" width="162" height="56" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="605" y="493" class="t">tiles + &lt;details&gt;</text><text x="605" y="511" class="s">jobs; tables folded</text><path d="M525,124 C560.0,124 560.0,150 589,150" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/><path d="M525,182 C560.0,182 560.0,150 589,150" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/><path d="M525,250 C560.0,250 560.0,265 589,265" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/><path d="M525,322 C560.0,322 560.0,285 589,285" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/><path d="M525,394 C560.0,394 560.0,285 589,285" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/><path d="M525,466 C560.0,466 560.0,285 589,285" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/><path d="M525,538 C560.0,538 560.0,285 589,285" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/><path d="M760,220 L760,234" stroke="#eb6834" stroke-width="1.4" marker-end="url(#ah)"/><path d="M760,310 L760,324" stroke="#eb6834" stroke-width="1.4" marker-end="url(#ah)"/><text x="595" y="565" class="s">svg_bars(): one shared horizontal-bar renderer</text><text x="595" y="581" class="s">status colours: blue &lt;85% · yellow ≥85% · red ≥95%</text><text x="595" y="597" class="s">fixed user colours, hvt632 always blue</text><rect x="980" y="60" width="230" height="560" rx="12" fill="#008300" fill-opacity="0.07" stroke="#008300" stroke-opacity="0.5"/><text x="1095.0" y="84" class="h" text-anchor="middle" fill="#008300">server.py / bin/firdash</text><rect x="995" y="100" width="200" height="86" rx="8" fill="#f2f9f2" stroke="#008300" stroke-width="1.5"/><text x="1005" y="119" class="t">page()  — cache 60 s</text><text x="1005" y="137" class="s">rebuild only when stale</text><text x="1005" y="152" class="s">reload = refresh</text><rect x="995" y="206" width="200" height="86" rx="8" fill="#f2f9f2" stroke="#008300" stroke-width="1.5"/><text x="1005" y="225" class="t">HTTP server</text><text x="1005" y="243" class="s">127.0.0.1 only</text><text x="1005" y="258" class="s">--port 8765 (0 = random)</text><rect x="995" y="312" width="200" height="70" rx="8" fill="#f2f9f2" stroke="#008300" stroke-width="1.5"/><text x="1005" y="331" class="t">--html FILE</text><text x="1005" y="349" class="s">static snapshot, no server</text><rect x="995" y="402" width="200" height="70" rx="8" fill="#f2f9f2" stroke="#008300" stroke-width="1.5"/><text x="1005" y="421" class="t">--days N</text><text x="1005" y="439" class="s">sacct history window</text><path d="M925,275 C960.0,275 960.0,143 989,143" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/><path d="M1095,186 L1095,200" stroke="#008300" stroke-width="1.4" marker-end="url(#ah)"/><path d="M925,275 C960.0,275 960.0,347 989,347" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/><rect x="1250" y="60" width="210" height="560" rx="12" fill="#6250d6" fill-opacity="0.07" stroke="#6250d6" stroke-opacity="0.5"/><text x="1355.0" y="84" class="h" text-anchor="middle" fill="#6250d6">You</text><rect x="1265" y="100" width="180" height="86" rx="8" fill="#ffffff" stroke="#6250d6" stroke-width="1.5"/><text x="1275" y="119" class="t">VS Code PORTS tab</text><text x="1275" y="137" class="s">forward 8765</text><text x="1275" y="152" class="s">or ssh -L … -J fir</text><rect x="1265" y="206" width="180" height="86" rx="8" fill="#ffffff" stroke="#6250d6" stroke-width="1.5"/><text x="1275" y="225" class="t">Browser</text><text x="1275" y="243" class="s">http://localhost:8765</text><text x="1275" y="258" class="s">hover bars for detail</text><rect x="1265" y="312" width="180" height="70" rx="8" fill="#ffffff" stroke="#6250d6" stroke-width="1.5"/><text x="1275" y="331" class="t">HTML file</text><text x="1275" y="349" class="s">open locally</text><path d="M1195,249 C1230.0,249 1230.0,143 1259,143" fill="none" stroke="#898781" stroke-width="1.4" marker-end="url(#ah)"/><text x="1230.0" y="191.0" class="a" text-anchor="middle">tunnel</text><path d="M1355,186 L1355,200" stroke="#6250d6" stroke-width="1.4" marker-end="u